name: Build Xbox Container IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # ESTA ES LA CLAVE: Forzamos la navegación interna y eliminamos el salto a Safari
      - name: Inject Pro Login Fix
        run: |
          find . -name "*.swift" -exec sed -i '' 's/decisionHandler(.allow)/if navigationAction.request.url?.host?.contains("microsoft.com") == true || navigationAction.request.url?.host?.contains("live.com") == true { webView.load(navigationAction.request); decisionHandler(.cancel); } else { decisionHandler(.allow); }/g' {} +
          find . -name "*.swift" -exec sed -i '' 's/func webView(_ webView: WKWebView, createWebViewWith/func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration, for navigationAction: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? { webView.load(navigationAction.request); return nil; } \/\/ /g' {} +

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project "ios-pwa-wrapper.xcodeproj" \
            -scheme "ios-pwa-wrapper" \
            -archivePath ./build/XboxContainer.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO

      - name: Export Payload
        run: |
          mkdir -p Payload
          cp -r ./build/XboxContainer.xcarchive/Products/Applications/*.app ./Payload/
          zip -r XboxContainer.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XboxContainer-IPA
          path: XboxContainer.ipa
