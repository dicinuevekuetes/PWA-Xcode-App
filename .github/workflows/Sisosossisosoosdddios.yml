name: Build Xbox Container IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Patch Navigation Logic
        run: |
          VIEWCONTROLLER_FILE=$(find . -name "ViewController.swift")
          
          # 1. ELIMINAR el salto a Safari: Reemplazamos la lógica de expulsión por una de carga interna
          # Buscamos el bloque que abre la URL en el sistema y lo neutralizamos
          sed -i '' 's/UIApplication.shared.open(requestUrl)/webView.load(navigationAction.request)/g' "$VIEWCONTROLLER_FILE"
          sed -i '' 's/UIApplication.shared.openURL(requestUrl)/webView.load(navigationAction.request)/g' "$VIEWCONTROLLER_FILE"
          
          # 2. Forzar que CUALQUIER host sea permitido durante el proceso de login
          # Esto hace que la app ignore si es microsoft, live o xbox y simplemente cargue el contenido
          sed -i '' 's/if (requestHost.range(of: allowedOrigin) != nil ) {/if (true) { \/\/ Bypass Origin Check/g' "$VIEWCONTROLLER_FILE"

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project "ios-pwa-wrapper.xcodeproj" \
            -scheme "ios-pwa-wrapper" \
            -archivePath ./build/XboxContainer.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export Payload
        run: |
          mkdir -p Payload
          cp -r ./build/XboxContainer.xcarchive/Products/Applications/*.app ./Payload/
          zip -r XboxContainer.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XboxContainer-IPA
          path: XboxContainer.ipa
