name: Build Xbox Container IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # PARCHE SEGURO: Solo permite el login interno para Remote Play
      - name: Patch App Logic
        run: |
          # Buscar archivos Swift donde sea que estén
          CONSTANTS_FILE=$(find . -name "Constants.swift")
          VIEWCONTROLLER_FILE=$(find . -name "ViewController.swift")
          
          # 1. Permitir dominios de Microsoft (necesario para Remote Play)
          sed -i '' 's/let allowedOrigin = "xbox.com"/let allowedOrigin = "xbox.com|microsoft.com|live.com"/g' "$CONSTANTS_FILE"
          
          # 2. Evitar que abra Safari al detectar el cambio de host durante el login
          sed -i '' 's/requestHost.range(of: allowedOrigin) != nil/requestHost.range(of: allowedOrigin, options: .regularExpression) != nil/g' "$VIEWCONTROLLER_FILE"

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project "ios-pwa-wrapper.xcodeproj" \
            -scheme "ios-pwa-wrapper" \
            -archivePath ./build/XboxContainer.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export Payload
        run: |
          mkdir -p Payload
          cp -r ./build/XboxContainer.xcarchive/Products/Applications/*.app ./Payload/
          zip -r XboxContainer.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XboxContainer-IPA
          path: XboxContainer.ipa
